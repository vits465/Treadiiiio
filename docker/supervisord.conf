[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:ml-service]
command=uvicorn api.main:app --host 127.0.0.1 --port 8000
directory=/app/ml-service
autostart=true
autorestart=true
stderr_logfile=/app/logs/ml-service-err.log
stdout_logfile=/app/logs/ml-service-out.log
environment=PYTHONUNBUFFERED="1"

[program:trading-engine]
command=node dist/index.js
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/trading-engine-err.log
stdout_logfile=/app/logs/trading-engine-out.log
